# sobe o sistema inteiro: banco, api e interface
#
#   cp .env.example .env    (e preenche as senhas)
#   docker compose up
#
# depois abre http://localhost:5173

services:
  banco:
    image: postgres:17-alpine
    container_name: 2ag-banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # os dados ficam num volume, entao nao se perdem quando o container morre
      - dados-do-banco:/var/lib/postgresql/data
    ports:
      # exposto pra vc conseguir olhar o banco com psql ou dbeaver
      - "5432:5432"
    healthcheck:
      # o backend so sobe depois q o banco responde de verdade
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/doisag
    container_name: 2ag-api
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      # dentro da rede do compose o host do banco eh o nome do servico
      DATABASE_URL: jdbc:postgresql://banco:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      SEED_DADOS_TESTE: ${SEED_DADOS_TESTE}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        # o vite injeta isso no momento do build, n em runtime
        VITE_API_URL: ${VITE_API_URL}
    container_name: 2ag-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  dados-do-banco:
