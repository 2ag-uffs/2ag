# sobe o sistema inteiro com banco api e front
#
#   cp .env.example .env    e preencha as senhas
#   docker compose up
#
# depois abra o navegador em localhost na porta 5173

services:
  banco:
    image: postgres:17-alpine
    container_name: 2ag-banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      # os dados ficam num volume e sobrevivem quando o container morre
      - dados-do-banco:/var/lib/postgresql/data
    # sem porta exposta o banco so eh alcancavel pela api dentro da rede do compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/doisag
    container_name: 2ag-api
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      # dentro da rede do compose o host do banco eh o nome do servico
      DATABASE_URL: jdbc:postgresql://banco:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SEED_DADOS_TESTE: ${SEED_DADOS_TESTE:-false}
      # sem padrao de proposito: endereco errado aqui derruba com 403 tudo q grava
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_DURATION_MINUTES: ${SESSION_DURATION_MINUTES:-120}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      # bloqueio do login por e-mail e por endereco
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_MAX_FAILURES_PER_ADDRESS: ${LOGIN_MAX_FAILURES_PER_ADDRESS:-20}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-15}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      # sem MAIL_HOST o e-mail vai pro log e o texto so aparece com isso ligado
      EMAIL_LOG_TEXT: ${EMAIL_LOG_TEXT:-false}
      TZ: America/Sao_Paulo
    # a api tbm n expoe porta e quem conversa com ela eh o nginx do front
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./frontend
    container_name: 2ag-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  dados-do-banco:
