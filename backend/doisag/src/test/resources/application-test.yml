# perfil de teste: roda tudo em memoria, sem precisar de postgres
# instalado. eh o que faz o "./mvnw test" funcionar numa maquina limpa
spring:
  datasource:
    # MODE=PostgreSQL faz o h2 aceitar tipo TEXT e sintaxe do postgres
    url: jdbc:h2:mem:doisag-teste;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    # ligado tbm no teste: assim a suite verifica a migracao de verdade,
    # e n so o codigo java
    enabled: true
  jpa:
    hibernate:
      # validate: quem cria as tabelas eh a migracao, o hibernate so
      # confere se as entidades batem com ela. se alguem mexer numa
      # entidade e esquecer da migracao, o teste quebra
      ddl-auto: validate
    show-sql: false

api:
  security:
    token:
      # chave fixa so de teste. n tem valor nenhum fora daqui
      secret: chave-de-teste-do-doisag-nao-usar-em-producao-0123456789-abcdefgh
  seed:
    # sem usuario de teste automatico, cada teste monta o que precisa
    enabled: false
  email:
    # no teste e na api local c/ banco em memoria o link de senha nova aparece no log
    log-text: true
  acompanhamento:
    # "-" desliga o agendamento. no teste quem dispara a logica somos nos,
    # passando a data na mao, senao n da pra testar o que acontece daqui
    # a 7, 30 ou 91 dias
    cron: "-"
