server:
  port: ${SERVER_PORT:8080} # porta onde a aplicação roda

spring:
  datasource:
    # os valores vem de variavel de ambiente. o que vem depois dos dois
    # pontos eh o padrao usado quando a variavel n esta definida
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/doisag}
    username: ${DATABASE_USER:admindoisag}
    # senha n tem padrao de proposito: melhor a aplicacao n subir do que
    # subir com uma senha que esta publicada no repositorio
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # update modifica o banco de dados baseado nas entidades
      ddl-auto: ${JPA_DDL_AUTO:update}
    # exibe o sql gerado pelo hibernate no console
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        # formata o sql exibido no console para ficar mais legível
        format_sql: true
    # define o dialeto sql específico para o postgresql
    # ajuda o hibernate a gerar o sql mais otimizado
    database-platform: org.hibernate.dialect.PostgreSQLDialect

api:
  security:
    token:
      # chave secreta para assinar e validar os tokens jwt.
      # tambem sem padrao: chave previsivel deixa qualquer um forjar token
      # pra gerar uma: openssl rand -base64 48
      secret: ${JWT_SECRET}
  cors:
    # origem do frontend que pode chamar a api
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  seed:
    # cria os usuarios de teste na subida. em producao tem q ser false,
    # senao nasce um prescritor com senha 123456 junto com a aplicacao
    enabled: ${SEED_DADOS_TESTE:false}
