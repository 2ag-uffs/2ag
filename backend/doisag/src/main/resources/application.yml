# configuracao da api
# o q muda de um ambiente pro outro vem de variavel de ambiente
# o valor depois dos dois pontos eh o padrao quando a variavel n existe

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/doisag}
    username: ${DATABASE_USER:admindoisag}
    # sem padrao de proposito pra api n subir com senha publicada no repositorio
    password: ${DATABASE_PASSWORD}
  flyway:
    # quem cria e altera tabela eh o flyway pelos arquivos da pasta de migracoes
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      # o hibernate so confere se o banco bate com as entidades e n altera nada
      ddl-auto: ${JPA_DDL_AUTO:validate}
    # sql no console so quando alguem pedir
    show-sql: ${JPA_SHOW_SQL:false}
    # fica ligado so ate o ultimo modulo antigo ser reescrito
    # os modulos novos carregam tudo dentro do servico e n dependem disso
    open-in-view: true

api:
  security:
    token:
      # chave q assina a sessao e tbm n tem padrao
      # pra gerar uma use openssl rand -base64 48
      secret: ${JWT_SECRET}
  cors:
    # origem do front q pode chamar a api
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  seed:
    # cria usuarios de teste na subida e so pode ser true em desenvolvimento
    enabled: ${SEED_DADOS_TESTE:false}
