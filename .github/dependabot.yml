# o dependabot so estava olhando o package-lock.json do frontend.
# o pom.xml nunca foi escaneado, entao o backend n estava limpo, estava
# sem verificacao. aqui a gente declara os dois.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # revisor de seguranca com ia q so depende do sdk da anthropic e roda com a chave dps do merge
  # os testes do ci usam modelo falso entao so veem se o sdk novo funciona e n se ele eh malicioso
  # o cooldown da tempo da versao ruim ser denunciada e do npm audit do ci pegar
  # antes de aceitar ver o changelog e se quem publicou eh o dono de sempre
  - package-ecosystem: npm
    directory: /.github/security-review
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: maven
    directory: /backend/doisag
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # as proprias actions tbm envelhecem
  # o checkout e o setup-node rodam no job do revisor entao a versao nova tbm espera uns dias
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # imagens base dos dockerfiles: node e nginx no front, maven e temurin na api
  # salto de versao maior (java 17 pra 25, node 22 pra 26) eh decisao do projeto, n do robo
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend/doisag
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # tag do maven tem o jdk no sufixo, a regra de cima n ve o salto do java
      - dependency-name: "maven"

  # a imagem do postgres fica no docker-compose.yml da raiz
  # postgres novo pede migracao do volume de dados, entao a versao maior tbm fica por conta do projeto
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
