# roda os testes do backend e o lint e o build do front a cada push e pr
# se algum passo quebrar o commit fica vermelho no github
name: ci

on:
  push:
  pull_request:

# o token do ci so le o repositorio, o job q precisa de mais pede no proprio job
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/doisag
    steps:
      # persist-credentials: false em todo checkout: o token n fica gravado no git do runner,
      # ao alcance do teste, do plugin do maven ou do pacote do npm q roda dps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # os testes usam h2 em memoria entao n precisa de banco nenhum aqui
      # o perfil docs traz o springdoc so pro teste da documentacao da api rodar
      - run: ./mvnw -B verify -Pdocs

  # manda a arvore inteira de dependencia do pom pro github, com as transitivas: sem isso o
  # dependabot so via as 19 diretas sem versao e nunca alertava sobre tomcat, spring, hibernate e cia (issue 116)
  # eh o unico job com token q escreve no repositorio, por isso fica separado dos testes e n tem passo run
  # so no push da main e dps dos testes passarem: em pull request o token eh de leitura e o envio falharia
  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sem cache de proposito: cache compartilhado eh caminho pra envenenar dependencia no job q escreve
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          # caminho absoluto: com o relativo a action procurava o mvnw em backend/doisag/backend/doisag
          directory: ${{ github.workspace }}/backend/doisag
          # a chave do envio eh o nome do job antigo: com outra a arvore q o job backend mandou nunca eh trocada
          correlator: backend

  # os mesmos testes do backend num postgres de verdade igual ao do compose (issue 38)
  # o h2 aceita coisa q o postgres recusa entao migracao ou query q so roda no h2 quebra aqui
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/doisag
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: doisag_teste
          POSTGRES_USER: doisag
          # senha so desse banco descartavel do ci
          POSTGRES_PASSWORD: doisag-ci
          TZ: America/Sao_Paulo
          PGTZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doisag -d doisag_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # variavel de ambiente vale mais q o application-test.yml entao os testes usam esse banco
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/doisag_teste
      SPRING_DATASOURCE_USERNAME: doisag
      SPRING_DATASOURCE_PASSWORD: doisag-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # sem script de instalacao de pacote: o lint, os testes e o build n dependem de nenhum
      - run: npm ci --ignore-scripts
      # dependencia de producao com falha alta ou critica quebra o build; a de desenvolvimento so avisa
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # testes do revisor de seguranca com ia do security-review.yml sem chave nenhuma
  # nos testes o modelo e o github sao falsos entao eles n chamam api nenhuma
  security-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/security-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sem cache igual no workflow do revisor
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  # todo link relativo dos .md tem q abrir um arquivo q existe: os tutoriais ja foram pra docs/ com link quebrado
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # n instala pacote nenhum: o teste so usa o q ja vem com o node
      - run: node --test scripts/check-doc-links.test.mjs
      # o compose tem q esperar a fila de e-mail da api antes de matar o container
      - run: node --test scripts/check-compose-stop.test.mjs
      # o Referer das chamadas da api n pode levar o codigo do convite nem o da senha nova pro log do nginx
      - run: node --test scripts/check-referrer-policy.test.mjs

  # garante q as imagens do compose continuam montando e q a pilha sobe de ponta a ponta
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose build
      # o nginx n sobe sem certificado, e aqui ele eh autoassinado (issue 57)
      - run: bash scripts/gerar-certificado-local.sh
      # o build so copia o arquivo do nginx, quem confere se ele esta certo eh o proprio nginx
      - run: docker compose run --rm --no-deps web nginx -t
      # o age cifra o backup q o smoke gera e restaura (issue 117)
      - run: sudo apt-get install -y age
      # sobe tudo com um .env de mentira, espera o healthcheck, faz login e um POST com cookie (issue 102)
      - run: bash scripts/ci-compose-smoke.sh
