# serve o front e repassa as chamadas da api pro backend
# como os dois ficam na mesma origem o navegador n precisa de cors
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cabecalhos de seguranca basicos
    # quem define add_header dentro de um location perde estes entao eles se repetem abaixo
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # tudo q comeca com api vai pro container da api
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # arquivo com hash no nome pode ficar em cache por um ano
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # o index nunca fica em cache senao o navegador n ve a versao nova
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # as rotas do react n existem como arquivo entao caem no index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
