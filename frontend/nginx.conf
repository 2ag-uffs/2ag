server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # o roteamento eh do lado do cliente (react router), ou seja o
    # nginx n conhece /dashboard-paciente e devolveria 404.
    # o try_files manda tudo q n eh arquivo real pro index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # asset com hash no nome pode cachear por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
