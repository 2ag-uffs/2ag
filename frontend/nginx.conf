# serve o front e repassa as chamadas da api pro backend
# como os dois ficam na mesma origem o navegador n precisa de cors
#
# o tls termina aqui mesmo (issue 57): o certificado da clinica fica em /etc/nginx/certs,
# q o compose monta da pasta certs/ ao lado do docker-compose.yml. sem proxy na frente,
# o endereco de quem acessa continua sendo o de verdade, entao o freio por endereco daqui
# e o da api seguem funcionando. se um dia entrar um proxy na frente, precisa de
# set_real_ip_from e real_ip_header, senao o limite pega todo mundo junto

# freio por endereco de quem acessa
# auth eh pras rotas q conferem senha ou criam conta e api eh a folga pro uso normal
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# o log guarda o caminho sem a query, pq o link de convite, o de senha nova e o de confirmacao do e-mail novo levam o codigo nela
map $request_uri $log_path {
    ~^(?<path_only>[^?]*) $path_only;
}
log_format sem_query '$remote_addr [$time_local] "$request_method $log_path $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

# a resposta n conta qual versao do nginx esta rodando
server_tokens off;

# http so redireciona pro https
# as excecoes sao o healthcheck do compose e o caminho q o certbot usa pra provar o dominio
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sem_query;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log sem_query;

    # certificado da clinica: fullchain.pem (certificado e intermediarios) e privkey.pem (chave sem senha)
    # sem os dois arquivos o nginx n sobe, e o erro aparece no docker compose logs web
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # no tls 1.3 quem escolhe a suite eh o cliente, e as do 1.2 acima sao todas boas
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # o nginx n troca a chave do ticket sozinho, e com ela parada o sigilo das sessoes antigas vai junto
    ssl_session_tickets off;

    # cabecalhos de seguranca de todas as respostas
    include /etc/nginx/snippets/security-headers.conf;
    # a api tbm manda hsts qnd sabe q veio por https, e dois cabecalhos diferentes confundem: fica so o daqui
    proxy_hide_header Strict-Transport-Security;

    # js e css saem comprimido, o q pesa na primeira abertura pelo celular
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # o docker da ip novo pra api qnd ela eh recriada
    # com o nome numa variavel o nginx resolve de novo em vez de guardar o ip velho e responder 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # so o endereco q o nginx enxerga, pq o q o cliente manda nesse cabecalho pode ser inventado
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;

    # o limite responde no formato de erro da api pra tela mostrar a mensagem
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"status":429,"error":"Too Many Requests","message":"Muitas requisições em pouco tempo. Aguarde um instante e tente de novo."}';
    }

    # rotas q conferem senha ou criam conta
    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api_upstream$request_uri;
    }

    location = /api/auth/register {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api_upstream$request_uri;
    }

    location ^~ /api/auth/password-reset/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api_upstream$request_uri;
    }

    location ^~ /api/auth/email-change/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api_upstream$request_uri;
    }

    # o resto da api
    # o ^~ impede a regra por extensao la de baixo de pegar um caminho da api
    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass $api_upstream$request_uri;
    }

    # arquivo com hash no nome pode ficar em cache por um ano
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # fonte e imagem sem hash no nome mudam pouco
    # sem always o cache n vale pra 404, senao um icone q ainda n existe ficaria guardado como ausente
    location ~* \.(woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        log_not_found off;
    }

    # o index nunca fica em cache senao o navegador n ve a versao nova
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # as rotas do react n existem como arquivo entao caem no index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
