<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- o simbolo verde some na barra de abas escura, entao o navegador no escuro pega o de palha.
         o verde vem por ultimo pq o navegador q n olha o media fica com o ultimo -->
    <link rel="icon" type="image/svg+xml" href="/images/logotipo-icon-claro.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/images/logotipo-icon.svg" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- a barra do navegador fica da cor do cabecalho. com tema escolhido no botao o theme-boot.js pinta as duas com a dele -->
    <meta name="theme-color" content="#006633" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16281d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="2AG acompanhamento terapêutico" />
    <!-- icone pra quem poe o 2AG na tela inicial do celular. abre na aba do navegador, sem service worker e sem nada guardado -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="2AG" />
    <title>2AG</title>
    <!-- a fonte do corpo do texto comeca a baixar junto com o js, sem esperar o css pedir ela -->
    <link rel="preload" href="/fonts/YaldeviColombo-Medium-latin.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="/boot.css" />
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot-loader" role="status" aria-label="Carregando"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
