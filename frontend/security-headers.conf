# cabecalhos de seguranca de todas as respostas do front
# o nginx so herda add_header do server qdo o location n tem nenhum
# por isso todo location com add_header proprio inclui este arquivo de novo
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# a pagina so carrega arquivos do proprio site e imagem ou fonte embutida
# sem script nem estilo inline e ninguem coloca o 2ag dentro de um iframe
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# o sistema n usa camera microfone localizacao pagamento nem usb
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# o navegador ignora em http e passa a exigir https depois do primeiro acesso por https
add_header Strict-Transport-Security "max-age=31536000" always;
